<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premier League Style 12-Team Tournament Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0c0014; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #150020; }
        ::-webkit-scrollbar-thumb { background: #37003c; border-radius: 10px; }
        .scrollbar-hidden::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">
    <header class="bg-[#37003c] border-b-4 border-[#00ff87] sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" alt="PL" class="h-full w-full object-contain" crossorigin="anonymous">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">PREMIER <span class="text-[#00ff87]">LEAGUE</span></h1>
                    <p class="text-[8px] text-slate-300 font-bold uppercase">THE ONE COMMUNITY</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="promptAdminPassword()" class="px-2.5 py-1.5 rounded-lg bg-[#00ff87]/20 text-[#00ff87] border border-[#00ff87]/40 text-[10px] font-bold hover:bg-[#00ff87] hover:text-[#37003c] transition">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Admin Edit
                </button>
                <div class="flex bg-[#1a001d] p-0.5 rounded-lg border border-purple-900/40">
                    <button id="tab-fixtures-btn" onclick="switchTab('fixtures')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg">Fixtures</button>
                    <button id="tab-standings-btn" onclick="switchTab('standings')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400">Standings</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div class="grid grid-cols-2 gap-2 mb-5">
            <div class="bg-[#1f0022]/80 border border-purple-950/60 p-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-[#00ff87] text-sm"></i>
                <div><span class="text-[8px] text-slate-400 block uppercase">Teams</span><span class="text-sm font-bold">12</span></div>
            </div>
            <div class="bg-[#1f0022]/80 border border-purple-950/60 p-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-cloud text-[#00ff87] text-sm"></i>
                <div><span class="text-[8px] text-slate-400 block uppercase">Database</span><span class="text-xs font-bold text-[#00ff87]" id="sync-status">Connected</span></div>
            </div>
        </div>

        <div id="tab-fixtures-content" class="space-y-4">
            <div class="bg-[#15001a] border border-purple-950 rounded-xl p-3 shadow-xl">
                <span class="text-[10px] font-bold text-[#00ff87] uppercase mb-2 block">Matchday Selector</span>
                <div class="flex gap-2 overflow-x-auto scrollbar-hidden pb-1" id="matchday-selector-container"></div>
            </div>

            <div class="flex justify-between items-center bg-[#1f0022] border-l-4 border-[#00ff87] p-3 rounded-r-xl">
                <h2 class="text-sm font-black text-white" id="fixture-round-title">ROUND 1</h2>
                <div class="flex gap-1">
                    <button onclick="changeMatchday(-1)" class="w-8 h-8 bg-[#37003c] rounded-lg text-[#00ff87]"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changeMatchday(1)" class="w-8 h-8 bg-[#37003c] rounded-lg text-[#00ff87]"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3" id="fixtures-grid"></div>
        </div>

        <div id="tab-standings-content" class="hidden space-y-4">
            <div class="bg-[#15001a] border border-purple-950 rounded-xl overflow-x-auto text-[10px]">
                <table class="w-full text-center min-w-[500px]">
                    <thead class="bg-[#37003c]/60">
                        <tr class="text-slate-400">
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 text-left pl-2">Club</th>
                            <th class="py-3">M</th>
                            <th class="py-3">W</th>
                            <th class="py-3">D</th>
                            <th class="py-3">L</th>
                            <th class="py-3 hidden sm:table-cell">GF</th>
                            <th class="py-3 hidden sm:table-cell">GA</th>
                            <th class="py-3">GD</th>
                            <th class="py-3 text-[#00ff87]">pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table-body" class="divide-y divide-purple-950/40 font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-[#15001a] border border-purple-900 rounded-2xl w-full max-w-lg p-5 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-purple-950">
                <h3 class="text-sm font-black text-[#00ff87] uppercase"><i class="fa-solid fa-shield-halved mr-1"></i> Admin Score Manager</h3>
                <button onclick="closeAdminModal()" class="w-7 h-7 bg-[#37003c] rounded-lg text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="py-3 flex gap-2 items-center">
                <label class="text-[10px] font-bold text-slate-400">Select Round:</label>
                <select id="admin-round-select" onchange="renderAdminMatches()" class="bg-[#1f0022] text-xs font-bold text-white px-3 py-1.5 rounded-lg border border-purple-900 focus:outline-none focus:border-[#00ff87]">
                </select>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2 pr-1 my-2" id="admin-matches-container"></div>
            <div class="pt-3 border-t border-purple-950 flex justify-end gap-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-800 text-xs font-bold rounded-lg text-slate-300">Cancel</button>
                <button onclick="saveAllResults()" class="px-4 py-2 bg-[#00ff87] text-[#37003c] text-xs font-black rounded-lg shadow-lg hover:opacity-90">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="password-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-[#15001a] border border-purple-900 rounded-2xl w-full max-w-xs p-5 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-purple-950">
                <h3 class="text-xs font-black text-[#00ff87] uppercase"><i class="fa-solid fa-lock mr-1"></i> Admin Password</h3>
                <button onclick="closePasswordModal()" class="w-6 h-6 bg-[#37003c] rounded-lg text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="py-4">
                <label class="text-[10px] font-bold text-slate-400 mb-1 block">Enter Admin Password:</label>
                <input type="password" id="admin-password-input" placeholder="Password" class="w-full bg-[#1f0022] border border-purple-900 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#00ff87]">
                <p id="password-error" class="text-[9px] text-red-400 mt-1 hidden">Incorrect password. Please try again.</p>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closePasswordModal()" class="px-3 py-1.5 bg-slate-800 text-[10px] font-bold rounded-lg text-slate-300">Cancel</button>
                <button onclick="verifyPassword()" class="px-3 py-1.5 bg-[#00ff87] text-[#37003c] text-[10px] font-black rounded-lg shadow-lg hover:opacity-90">Login</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCG8xdfNHBFKo1VlfBYCYZTP-8vid3R97I",
            authDomain: "superepl.firebaseapp.com",
            projectId: "superepl",
            storageBucket: "superepl.firebasestorage.app",
            messagingSenderId: "885676848744",
            appId: "1:885676848744:web:c13a2ef4e370adafc2eddd",
            measurementId: "G-SVKV23ZZS2"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TEAMS_LIST = [
            { id: "MU", name: "Man United", logo: "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg", telegram: "https://t.me/Wolfy21002" },
            { id: "MC", name: "Man City", logo: "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg", telegram: "https://t.me/Sammykaung" },
            { id: "ARS", name: "Arsenal", logo: "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg", telegram: "https://t.me/bobominhein" },
            { id: "LIV", name: "Liverpool", logo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg", telegram: "https://t.me/MGYeye1473" },
            { id: "CHE", name: "Chelsea", logo: "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg", telegram: "https://t.me/Sanminoo" },
            { id: "TOT", name: "Tottenham", logo: "https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg", telegram: "https://t.me/iz_szlai" },
            { id: "NFO", name: "Nottingham", logo: "https://upload.wikimedia.org/wikipedia/en/e/e5/Nottingham_Forest_F.C._logo.svg", telegram: "https://t.me/Aung19959" },
            { id: "NEW", name: "Newcastle", logo: "https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg", telegram: "https://t.me/zeusace0" },
            { id: "AVL", name: "Aston Villa", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/86/Aston_Villa_F.C._logo.svg/250px-Aston_Villa_F.C._logo.svg.png", telegram: "https://t.me/aamk79" },
            { id: "LEE", name: "Leeds", logo: "https://upload.wikimedia.org/wikipedia/en/5/54/Leeds_United_F.C._logo.svg", telegram: "https://t.me/" },
            { id: "WOL", name: "Wolves", logo: "https://upload.wikimedia.org/wikipedia/en/f/fc/Wolverhampton_Wanderers.svg", telegram: "https://t.me/MoungNaing" },
            { id: "BRI", name: "Brighton", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/d/d0/Brighton_and_Hove_Albion_FC_crest.svg/250px-Brighton_and_Hove_Albion_FC_crest.svg.png", telegram: "https://t.me/Naindjjd" }
        ];

        let fixtures = [], currentViewingMatchday = 0, TOTAL_ROUNDS = 11;
        let standingsData = [];
        let RESULTS = {};

        window.onload = async function() {
            generateFixedRoundRobinFixtures();
            renderMatchdaySelector();
            
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (customErr) {
                        console.warn("Custom token sign-in failed, falling back to anonymous auth:", customErr);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
                
                const docRef = doc(db, 'tournament_results', 'premier_league_12_team');
                
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().results) {
                        RESULTS = docSnap.data().results;
                    } else {
                        RESULTS = {};
                        setDoc(docRef, { results: RESULTS }).catch(console.error);
                    }
                    processAllResults();
                    renderFixtures();
                    updateStandingsTable();
                }, (error) => {
                    console.error("Firestore listener error:", error);
                    RESULTS = {};
                    processAllResults();
                    renderFixtures();
                    updateStandingsTable();
                });

            } catch (e) {
                console.error("Auth/Init error:", e);
                RESULTS = {};
                processAllResults();
                renderFixtures();
                updateStandingsTable();
            }
        };

        function processAllResults() {
            standingsData = TEAMS_LIST.map(t => ({ ...t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
            Object.values(RESULTS).forEach(round => {
                if (!round) return;
                round.forEach(res => {
                    if (res.hs === undefined || res.hs === null || res.hs === "" || res.as === undefined || res.as === null || res.as === "") return;
                    const h = standingsData.find(t => t.id === res.home), a = standingsData.find(t => t.id === res.away);
                    if(!h || !a) return;
                    const hs = parseInt(res.hs), as = parseInt(res.as);
                    h.mp++; a.mp++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
                    h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
                    if (hs > as) { h.w++; h.pts += 3; a.l++; } else if (hs < as) { a.w++; a.pts += 3; h.l++; } else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
                });
            });
        }

        window.switchTab = function(tab) {
            document.getElementById('tab-fixtures-content').classList.toggle('hidden', tab !== 'fixtures');
            document.getElementById('tab-standings-content').classList.toggle('hidden', tab !== 'standings');
            document.getElementById('tab-fixtures-btn').className = tab === 'fixtures' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
            document.getElementById('tab-standings-btn').className = tab === 'standings' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
            if(tab === 'standings') updateStandingsTable();
        };

        function generateFixedRoundRobinFixtures() {
            const numTeams = TEAMS_LIST.length;
            for (let round = 0; round < numTeams - 1; round++) {
                const roundMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    const home = (round + i) % (numTeams - 1), away = (i === 0) ? numTeams - 1 : (numTeams - 1 - i + round) % (numTeams - 1);
                    roundMatches.push({ home: TEAMS_LIST[home].id, away: TEAMS_LIST[away].id });
                }
                fixtures.push(roundMatches);
            }
        }

        function renderMatchdaySelector() {
            const container = document.getElementById('matchday-selector-container');
            container.innerHTML = '';
            for (let r = 0; r < TOTAL_ROUNDS; r++) {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${r === 0 ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                btn.innerText = `R${r + 1}`;
                btn.onclick = () => { 
                    currentViewingMatchday = r; 
                    document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                        b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === r ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                    });
                    renderFixtures(); 
                };
                container.appendChild(btn);
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-grid');
            if(!container) return;
            container.innerHTML = '';
            document.getElementById('fixture-round-title').innerText = `ROUND ${currentViewingMatchday + 1}`;
            const roundData = fixtures[currentViewingMatchday];
            const roundResults = RESULTS[currentViewingMatchday] || [];
            
            roundData.forEach(match => {
                const h = TEAMS_LIST.find(t => t.id === match.home), a = TEAMS_LIST.find(t => t.id === match.away);
                const res = roundResults.find(r => r.home === h.id && r.away === a.id);
                
                let scoreDisplay = '<span class="text-[#00ff87] font-black text-[10px] w-[20%] text-center">VS</span>';
                if (res && res.hs !== undefined && res.hs !== null && res.hs !== "") {
                    scoreDisplay = `<span class="text-white font-bold text-xs w-[20%] text-center">${res.hs} - ${res.as}</span>`;
                }

                const card = document.createElement('div');
                card.className = "bg-[#15001a] border border-purple-950 rounded-xl p-3 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-2 w-[40%]"><img src="${h.logo}" class="w-8 h-8 object-contain" crossorigin="anonymous"><a href="${h.telegram}" target="_blank" class="text-xs font-bold truncate hover:text-[#00ff87]">${h.name}</a></div>
                    ${scoreDisplay}
                    <div class="flex items-center gap-2 w-[40%] justify-end"><a href="${a.telegram}" target="_blank" class="text-xs font-bold truncate hover:text-[#00ff87] text-right">${a.name}</a><img src="${a.logo}" class="w-8 h-8 object-contain" crossorigin="anonymous"></div>`;
                container.appendChild(card);
            });
        }

        function updateStandingsTable() {
            const tbody = document.getElementById('standings-table-body');
            if(!tbody) return;
            const sorted = [...standingsData].sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            tbody.innerHTML = sorted.map((t, i) => `
                <tr class="hover:bg-[#37003c]/20">
                    <td class="py-3 px-2">${i+1}</td>
                    <td class="text-left py-3 pl-2"><a href="${t.telegram}" target="_blank" class="flex items-center gap-2"><img src="${t.logo}" class="w-5 h-5 object-contain" crossorigin="anonymous"><span class="font-semibold text-white">${t.name}</span></a></td>
                    <td class="py-3">${t.mp}</td><td class="py-3">${t.w}</td><td class="py-3">${t.d}</td><td class="py-3">${t.l}</td>
                    <td class="py-3 hidden sm:table-cell">${t.gf}</td><td class="py-3 hidden sm:table-cell">${t.ga}</td>
                    <td class="py-3">${t.gd}</td><td class="py-3 font-black text-[#00ff87]">${t.pts}</td>
                </tr>`).join('');
        }
        
        window.changeMatchday = function(d) {
            let n = currentViewingMatchday + d;
            if (n >= 0 && n < TOTAL_ROUNDS) { 
                currentViewingMatchday = n; 
                document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                    b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === n ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                });
                renderFixtures(); 
            }
        };

        window.promptAdminPassword = function() {
            document.getElementById('admin-password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');
            document.getElementById('password-modal').classList.remove('hidden');
        };

        window.closePasswordModal = function() {
            document.getElementById('password-modal').classList.add('hidden');
        };

        window.verifyPassword = function() {
            const pass = document.getElementById('admin-password-input').value;
            if (pass === "2024") {
                closePasswordModal();
                openAdminModal();
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        };

        window.openAdminModal = function() {
            document.getElementById('admin-modal').classList.remove('hidden');
            const select = document.getElementById('admin-round-select');
            select.innerHTML = '';
            for(let i=0; i<TOTAL_ROUNDS; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Round ${i+1}`;
                if(i === currentViewingMatchday) opt.selected = true;
                select.appendChild(opt);
            }
            renderAdminMatches();
        };

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        };

        window.renderAdminMatches = function() {
            const roundIdx = parseInt(document.getElementById('admin-round-select').value);
            const container = document.getElementById('admin-matches-container');
            container.innerHTML = '';
            const roundData = fixtures[roundIdx];
            const roundResults = RESULTS[roundIdx] || [];

            roundData.forEach((match) => {
                const h = TEAMS_LIST.find(t => t.id === match.home), a = TEAMS_LIST.find(t => t.id === match.away);
                const res = roundResults.find(r => r.home === h.id && r.away === a.id) || { home: h.id, away: a.id, hs: '', as: '' };

                const row = document.createElement('div');
                row.className = "bg-[#1f0022] p-2.5 rounded-xl border border-purple-950 flex items-center justify-between gap-2";
                row.innerHTML = `
                    <div class="text-xs font-bold w-[38%] truncate text-right">${h.name}</div>
                    <div class="flex items-center gap-1 w-[24%] justify-center">
                        <input type="number" min="0" data-home="${h.id}" data-away="${a.id}" class="hs-input w-10 bg-[#15001a] border border-purple-900 rounded text-center text-xs font-bold py-1 text-white focus:outline-none focus:border-[#00ff87]" value="${res.hs !== undefined ? res.hs : ''}">
                        <span class="text-slate-500">-</span>
                        <input type="number" min="0" data-home="${h.id}" data-away="${a.id}" class="as-input w-10 bg-[#15001a] border border-purple-900 rounded text-center text-xs font-bold py-1 text-white focus:outline-none focus:border-[#00ff87]" value="${res.as !== undefined ? res.as : ''}">
                    </div>
                    <div class="text-xs font-bold w-[38%] truncate">${a.name}</div>
                `;
                container.appendChild(row);
            });
        };

        window.saveAllResults = async function() {
            const roundIdx = parseInt(document.getElementById('admin-round-select').value);
            const container = document.getElementById('admin-matches-container');
            const hInputs = container.querySelectorAll('.hs-input');
            const aInputs = container.querySelectorAll('.as-input');

            const newRoundResults = [];
            for(let i=0; i<hInputs.length; i++) {
                const home = hInputs[i].getAttribute('data-home');
                const away = hInputs[i].getAttribute('data-away');
                const hsVal = hInputs[i].value;
                const asVal = aInputs[i].value;
                newRoundResults.push({
                    home: home,
                    away: away,
                    hs: hsVal !== "" ? parseInt(hsVal) : "",
                    as: asVal !== "" ? parseInt(asVal) : ""
                });
            }

            RESULTS[roundIdx] = newRoundResults;
            processAllResults();
            renderFixtures();
            updateStandingsTable();

            try {
                const docRef = doc(db, 'tournament_results', 'premier_league_12_team');
                await setDoc(docRef, { results: RESULTS });
                closeAdminModal();
            } catch(err) {
                console.error("Error saving to Firebase:", err);
            }
        };
    </script>
</body>
