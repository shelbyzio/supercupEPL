<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premier League Style 12-Team Tournament Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0c0014; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #150020; }
        ::-webkit-scrollbar-thumb { background: #37003c; border-radius: 10px; }
        .scrollbar-hidden::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <header class="bg-[#37003c] border-b-4 border-[#00ff87] sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" alt="PL" class="h-full w-full object-contain">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">PREMIER <span class="text-[#00ff87]">LEAGUE</span></h1>
                    <p class="text-[8px] text-slate-300 font-bold uppercase">THE ONE COMMUNITY</p>
                </div>
            </div>
            <div class="flex bg-[#1a001d] p-0.5 rounded-lg border border-purple-900/40">
                <button id="tab-fixtures-btn" onclick="switchTab('fixtures')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg">Fixtures</button>
                <button id="tab-standings-btn" onclick="switchTab('standings')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400">Standings</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div class="grid grid-cols-2 gap-2 mb-5">
            <div class="bg-[#1f0022]/80 border border-purple-950/60 p-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-[#00ff87] text-sm"></i>
                <div><span class="text-[8px] text-slate-400 block uppercase">Teams</span><span class="text-sm font-bold">12</span></div>
            </div>
            <div class="bg-[#1f0022]/80 border border-purple-950/60 p-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-[#00ff87] text-sm"></i>
                <div><span class="text-[8px] text-slate-400 block uppercase">Matches</span><span class="text-sm font-bold">66</span></div>
            </div>
        </div>

        <div id="tab-fixtures-content" class="space-y-4">
            <div class="bg-[#15001a] border border-purple-950 rounded-xl p-3 shadow-xl">
                <span class="text-[10px] font-bold text-[#00ff87] uppercase mb-2 block">Matchday Selector</span>
                <div class="flex gap-2 overflow-x-auto scrollbar-hidden pb-1" id="matchday-selector-container"></div>
            </div>

            <div class="flex justify-between items-center bg-[#1f0022] border-l-4 border-[#00ff87] p-3 rounded-r-xl">
                <h2 class="text-sm font-black text-white" id="fixture-round-title">ROUND 1</h2>
                <div class="flex gap-1">
                    <button onclick="changeMatchday(-1)" class="w-8 h-8 bg-[#37003c] rounded-lg text-[#00ff87]"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changeMatchday(1)" class="w-8 h-8 bg-[#37003c] rounded-lg text-[#00ff87]"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3" id="fixtures-grid"></div>
        </div>

        <div id="tab-standings-content" class="hidden space-y-4">
            <div class="bg-[#15001a] border border-purple-950 rounded-xl overflow-x-auto text-[10px]">
                <table class="w-full text-center min-w-[500px]">
                    <thead class="bg-[#37003c]/60">
                        <tr class="text-slate-400">
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 text-left pl-2">Club</th>
                            <th class="py-3">M</th>
                            <th class="py-3">W</th>
                            <th class="py-3">D</th>
                            <th class="py-3">L</th>
                            <th class="py-3 hidden sm:table-cell">GF</th>
                            <th class="py-3 hidden sm:table-cell">GA</th>
                            <th class="py-3">GD</th>
                            <th class="py-3 text-[#00ff87]">pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table-body" class="divide-y divide-purple-950/40 font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const TEAMS_LIST = [
            { id: "MU", name: "Man United", logo: "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg", telegram: "https://t.me/Hemaljr10", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "MC", name: "Man City", logo: "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg", telegram: "https://t.me/iz_szlai", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "ARS", name: "Arsenal", logo: "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg", telegram: "https://t.me/Phir_tayin", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "LIV", name: "Liverpool", logo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg", telegram: "https://t.me/Badrul11", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "CHE", name: "Chelsea", logo: "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg", telegram: "https://t.me/aungnayzan", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "TOT", name: "Tottenham", logo: "https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg", telegram: "https://t.me/khantt453", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "NFO", name: "Nottingham", logo: "https://upload.wikimedia.org/wikipedia/en/e/e5/Nottingham_Forest_F.C._logo.svg", telegram: "https://t.me/Doue998", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "NEW", name: "Newcastle", logo: "https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg", telegram: "https://t.me/Afgdggcghvc", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "AVL", name: "Aston Villa", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/86/Aston_Villa_F.C._logo.svg/250px-Aston_Villa_F.C._logo.svg.png", telegram: "https://t.me/Akkkk2000", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "LEE", name: "Leeds", logo: "https://upload.wikimedia.org/wikipedia/en/5/54/Leeds_United_F.C._logo.svg", telegram: "https://t.me/jelium", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "WOL", name: "Wolves", logo: "https://upload.wikimedia.org/wikipedia/en/f/fc/Wolverhampton_Wanderers.svg", telegram: "https://t.me/DaweiBlay", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: "EVE", name: "Everton", logo: "https://upload.wikimedia.org/wikipedia/en/7/7c/Everton_FC_logo.svg", telegram: "https://t.me/waiyan2276", mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }
        ];

        let fixtures = [], currentViewingMatchday = 0, TOTAL_ROUNDS = 11;

        const ROUND_1_RESULTS = [
            { home: "MU", away: "EVE", hs: 4, as: 2 },
            { home: "MC", away: "WOL", hs: 2, as: 1 },
            { home: "ARS", away: "LEE", hs: 1, as: 8 },
            { home: "LIV", away: "AVL", hs: 11, as: 1 },
            { home: "CHE", away: "NEW", hs: 1, as: 1 },
            { home: "TOT", away: "NFO", hs: 2, as: 0 }
        ];

        const ROUND_2_RESULTS = [
            { home: "MC", away: "EVE", hs: 5, as: 2 },
            { home: "ARS", away: "MU", hs: 2, as: 2 },
            { home: "LIV", away: "WOL", hs: 12, as: 3 },
            { home: "CHE", away: "LEE", hs: 0, as: 3 },
            { home: "TOT", away: "AVL", hs: 3, as: 0 },
            { home: "NEW", away: "NFO", hs: 6, as: 7 }
        ];

        const ROUND_3_RESULTS = [
            { home: "EVE", away: "ARS", hs: 4, as: 2 },
            { home: "MC", away: "LIV", hs: 4, as: 3 },
            { home: "CHE", away: "MU", hs: 4, as: 4 },
            { home: "TOT", away: "WOL", hs: 7, as: 0 },
            { home: "NFO", away: "LEE", hs: 2, as: 4 },
            { home: "NEW", away: "AVL", hs: 3, as: 0 }
        ];

        const ROUND_4_RESULTS = [
            { home: "LIV", away: "EVE", hs: null, as: null, status: 'cancelled' },
            { home: "CHE", away: "ARS", hs: 4, as: 0 },
            { home: "TOT", away: "MC", hs: 1, as: 2 },
            { home: "NFO", away: "MU", hs: 0, as: 6 },
            { home: "NEW", away: "WOL", hs: 2, as: 4 },
            { home: "AVL", away: "LEE", hs: 1, as: 10 }
        ];

        window.onload = function() { 
            generateFixedRoundRobinFixtures(); 
            processAllResults();
            renderMatchdaySelector(); 
            renderFixtures(); 
        };

        function processResult(res) {
            if (res.hs === null) return;
            const homeTeam = TEAMS_LIST.find(t => t.id === res.home);
            const awayTeam = TEAMS_LIST.find(t => t.id === res.away);
            homeTeam.mp++; awayTeam.mp++;
            homeTeam.gf += res.hs; homeTeam.ga += res.as;
            awayTeam.gf += res.as; awayTeam.ga += res.hs;
            homeTeam.gd = homeTeam.gf - homeTeam.ga;
            awayTeam.gd = awayTeam.gf - awayTeam.ga;
            if (res.hs > res.as) { homeTeam.w++; homeTeam.pts += 3; awayTeam.l++; } 
            else if (res.hs < res.as) { awayTeam.w++; awayTeam.pts += 3; homeTeam.l++; } 
            else { homeTeam.d++; awayTeam.d++; homeTeam.pts += 1; awayTeam.pts += 1; }
        }

        function processAllResults() {
            TEAMS_LIST.forEach(t => { t.mp = 0; t.w = 0; t.d = 0; t.l = 0; t.gf = 0; t.ga = 0; t.gd = 0; t.pts = 0; });
            ROUND_1_RESULTS.forEach(processResult);
            ROUND_2_RESULTS.forEach(processResult);
            ROUND_3_RESULTS.forEach(processResult);
            ROUND_4_RESULTS.forEach(processResult);
        }

        function switchTab(tab) {
            document.getElementById('tab-fixtures-content').classList.toggle('hidden', tab !== 'fixtures');
            document.getElementById('tab-standings-content').classList.toggle('hidden', tab !== 'standings');
            document.getElementById('tab-fixtures-btn').className = tab === 'fixtures' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
            document.getElementById('tab-standings-btn').className = tab === 'standings' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#00ff87] bg-[#37003c] shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
            if(tab === 'standings') updateStandingsTable();
        }

        function generateFixedRoundRobinFixtures() {
            const numTeams = TEAMS_LIST.length;
            for (let round = 0; round < numTeams - 1; round++) {
                const roundMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    const home = (round + i) % (numTeams - 1), away = (i === 0) ? numTeams - 1 : (numTeams - 1 - i + round) % (numTeams - 1);
                    roundMatches.push({ home: TEAMS_LIST[home].id, away: TEAMS_LIST[away].id });
                }
                fixtures.push(roundMatches);
            }
        }

        function renderMatchdaySelector() {
            const container = document.getElementById('matchday-selector-container');
            for (let r = 0; r < TOTAL_ROUNDS; r++) {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${r === 0 ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                btn.innerText = `R${r + 1}`;
                btn.onclick = () => { 
                    currentViewingMatchday = r; 
                    document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                        b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === r ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                    });
                    renderFixtures(); 
                };
                container.appendChild(btn);
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-grid');
            container.innerHTML = '';
            document.getElementById('fixture-round-title').innerText = `ROUND ${currentViewingMatchday + 1}`;
            
            fixtures[currentViewingMatchday].forEach(match => {
                const h = TEAMS_LIST.find(t => t.id === match.home), a = TEAMS_LIST.find(t => t.id === match.away);
                let scoreDisplay = '<span class="text-[#00ff87] font-black text-[10px] w-[20%] text-center">VS</span>';
                
                let result = null;
                if (currentViewingMatchday === 0) result = ROUND_1_RESULTS.find(r => (r.home === h.id && r.away === a.id) || (r.home === a.id && r.away === h.id));
                if (currentViewingMatchday === 1) result = ROUND_2_RESULTS.find(r => (r.home === h.id && r.away === a.id) || (r.home === a.id && r.away === h.id));
                if (currentViewingMatchday === 2) result = ROUND_3_RESULTS.find(r => (r.home === h.id && r.away === a.id) || (r.home === a.id && r.away === h.id));
                if (currentViewingMatchday === 3) result = ROUND_4_RESULTS.find(r => (r.home === h.id && r.away === a.id) || (r.home === a.id && r.away === h.id));
                
                if (result && result.status === 'cancelled') {
                    scoreDisplay = '<span class="text-red-500 font-bold text-[8px] w-[20%] text-center uppercase">Cancelled</span>';
                } else if (result && result.hs !== null) {
                    const homeScore = result.home === h.id ? result.hs : result.as;
                    const awayScore = result.home === h.id ? result.as : result.hs;
                    scoreDisplay = `<span class="text-white font-bold text-xs w-[20%] text-center">${homeScore} - ${awayScore}</span>`;
                }

                const card = document.createElement('div');
                card.className = "bg-[#15001a] border border-purple-950 rounded-xl p-3 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-2 w-[40%]">
                        <img src="${h.logo}" class="w-8 h-8 object-contain">
                        <a href="${h.telegram}" target="_blank" class="text-xs font-bold truncate hover:text-[#00ff87] transition-colors">${h.name}</a>
                    </div>
                    ${scoreDisplay}
                    <div class="flex items-center gap-2 w-[40%] justify-end">
                        <a href="${a.telegram}" target="_blank" class="text-xs font-bold truncate hover:text-[#00ff87] transition-colors">${a.name}</a>
                        <img src="${a.logo}" class="w-8 h-8 object-contain">
                    </div>`;
                container.appendChild(card);
            });
        }

        function updateStandingsTable() {
            const tbody = document.getElementById('standings-table-body');
            const sortedTeams = [...TEAMS_LIST].sort((a, b) => b.pts - a.pts || b.gd - a.gd);
            tbody.innerHTML = sortedTeams.map((team, idx) => `
                <tr class="hover:bg-[#37003c]/20 transition-colors">
                    <td class="py-3 px-2">${idx+1}</td>
                    <td class="text-left py-3 pl-2">
                        <a href="${team.telegram}" target="_blank" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                            <img src="${team.logo}" class="w-5 h-5 object-contain">
                            <span class="font-semibold text-white">${team.name}</span>
                        </a>
                    </td>
                    <td class="py-3">${team.mp}</td>
                    <td class="py-3">${team.w}</td>
                    <td class="py-3">${team.d}</td>
                    <td class="py-3">${team.l}</td>
                    <td class="py-3 hidden sm:table-cell">${team.gf}</td>
                    <td class="py-3 hidden sm:table-cell">${team.ga}</td>
                    <td class="py-3">${team.gd}</td>
                    <td class="py-3 font-black text-[#00ff87]">${team.pts}</td>
                </tr>
            `).join('');
        }
        
        function changeMatchday(d) {
            let n = currentViewingMatchday + d;
            if (n >= 0 && n < TOTAL_ROUNDS) { 
                currentViewingMatchday = n; 
                document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                    b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === n ? 'bg-[#00ff87] text-[#37003c]' : 'bg-[#1a001d] text-slate-400'}`;
                });
                renderFixtures(); 
            }
        }
    </script>
</body>
</html>
